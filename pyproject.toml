[project]
name = "claimguard"
version = "0.1.0"
description = "Disagreement safety for multi-agent systems: replace the merge step, preserve the conflict, let a reviewer verify it"
readme = "README.md"
requires-python = ">=3.11"
# The aggregator imports nothing outside the standard library.
dependencies = []

[project.optional-dependencies]
# Layer 2 only. Without these, K4 and K8 degrade to UNDECIDED and say so.
nli = ["torch>=2.0", "transformers>=4.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
